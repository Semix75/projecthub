<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mercure Debugging Tools</title>
    </head>
    <body>
        <h1>Mercure Debugging Tools</h1>

        <h2>📡 S'abonner à un topic</h2>
        <input type="text" id="subscribeTopic"
            placeholder="Nom du topic (ex: chat)">
        <button onclick="subscribe()">S'abonner</button>
        <div id="messages"></div>

        <h2>🚀 Publier un message</h2>
        <input type="text" id="publishTopic"
            placeholder="Nom du topic (ex: chat)">
        <textarea id="publishMessage"
            placeholder="Message à envoyer"></textarea>
        <button onclick="publish()">Envoyer</button>

        <script>
        function subscribe() {
    const topic = document.getElementById('subscribeTopic').value;

    fetch("http://127.0.0.1:8000/generate_jwt.php")
        .then(response => response.text())
        .then(jwt => {
            console.log("✅ JWT reçu :", jwt); // Vérifie que le token est bien récupéré

            const eventSource = new EventSource(`http://localhost:3000/.well-known/mercure?topic=${topic}`);


            eventSource.onopen = () => console.log("✅ Connexion Mercure établie !");
            eventSource.onerror = (err) => console.error("🚨 Erreur EventSource :", err);
            eventSource.onmessage = function(event) {
                console.log("📩 [DEBUG] Nouveau message détecté !");
    console.log("📩 Message reçu :", event.data);

    const messageDiv = document.getElementById('messages');
    const newMessage = document.createElement('p');
    newMessage.textContent = `📩 Nouveau message: ${event.data}`;
    messageDiv.appendChild(newMessage);
            };

            alert(`📡 Abonné au topic: ${topic}`);
        })
        .catch(error => console.error("❌ Erreur lors de la récupération du JWT :", error));
}

        function publish() {
    const topic = document.getElementById('publishTopic').value;
    const message = document.getElementById('publishMessage').value;
    const jwt = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJtZXJjdXJlIjp7InB1Ymxpc2giOlsiKiJdfX0.nnAPTzW8pKUc6dBzroLtcU9QswwZf54NkppcxAC48qQ";

    fetch("http://localhost:3000/.well-known/mercure", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + jwt,
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `topic=${topic}&data=${message}`
    }).then(response => {
        if (response.ok) {
            alert("Message envoyé !");
        } else {
            alert("Erreur lors de l'envoi.");
        }
    });
}

    </script>
    </body>
</html>
