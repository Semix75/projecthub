services:
  symfony:
    image: php:8.2-apache
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  mercure:
    image: dunglas/mercure
    container_name: mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: 'adel'
      MERCURE_SUBSCRIBER_JWT_KEY: 'adel'
      MERCURE_JWT_SECRET: 'adel'
      MERCURE_CORS_ALLOWED_ORIGINS: '*'
      MERCURE_PUBLISH_ALLOWED_ORIGINS: '*'
      MERCURE_UI: 1
      MERCURE_EXTRA_DIRECTIVES: |
        ui 
        cors_origins *
        publish_origins *
        allow_anonymous
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  consul:
    image: hashicorp/consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"

  promtail:
    image: grafana/promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - .:/var/www/html  # Ajoute ceci pour que Promtail voie les logs Symfony
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki


volumes:
  grafana-storage:
  mercure_data:
  mercure_config: