services:
  symfony:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus

  mercure:
    image: dunglas/mercure
    container_name: mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: 'adel'
      MERCURE_SUBSCRIBER_JWT_KEY: 'adel'
      MERCURE_JWT_SECRET: 'adel'
      MERCURE_CORS_ALLOWED_ORIGINS: '*'
      MERCURE_PUBLISH_ALLOWED_ORIGINS: '*'
      MERCURE_UI: 1
      MERCURE_EXTRA_DIRECTIVES: |
        ui 
        cors_origins *
        publish_origins *
        allow_anonymous
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  grafana-storage:
  mercure_data:
  mercure_config:
