image: php:8.2

variables:
  # Utilisation de SQLite pour l'environnement de test
  DATABASE_URL: "sqlite:///%kernel.project_dir%/var/projecthub_test.db"
  NODE_ENV: development

stages:
  - install
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

before_script:
  # Mise à jour et installation des dépendances système (incluant gnupg et libsqlite3-dev)
  - apt-get update && apt-get install -y unzip git libicu-dev libxml2-dev libzip-dev gnupg curl libsqlite3-dev
  # Installation des extensions PHP nécessaires (pdo, pdo_sqlite, intl, zip)
  - docker-php-ext-install pdo pdo_sqlite intl zip
  # Installation de Composer
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  # Installation de Node.js et npm
  - apt-get install -y nodejs npm
  # Installation de Yarn : ajout du dépôt officiel et installation
  - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
  - echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list
  - apt-get update && apt-get install -y yarn

install_dependencies:
  stage: install
  script:
    # Installation des dépendances PHP
    - composer install --prefer-dist --no-interaction --optimize-autoloader
    # Installation des dépendances Node.js
    - npm install
    - yarn install

test:
  stage: test
  script:
    # Met à jour le schéma de la base de test (SQLite)
    - php bin/console doctrine:schema:update --force --env=test
    # Exécute l'ensemble des tests PHPUnit
    - vendor/bin/phpunit

build_front:
  stage: build
  script:
    # Correction automatique d'une éventuelle faute de frappe dans vite.config.js
    - sed -i 's/jsxFrament/jsxFragment/g' vite.config.js || true
    # Compilation des assets front-end (vider le dossier de sortie)
    - yarn build --emptyOutDir
  artifacts:
    paths:
      - public/build