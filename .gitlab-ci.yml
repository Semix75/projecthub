image: php:8.2

services:
  - mysql:5.7

variables:
  MYSQL_DATABASE: projecthub_test
  MYSQL_ROOT_PASSWORD: root
  DATABASE_URL: "mysql://root:root@mysql:3306/projecthub_test"
  NODE_ENV: development

stages:
  - install
  - lint
  - test
  - build

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - node_modules/

before_script:
  # Mise à jour et installation des dépendances système (incluant gnupg pour apt-key)
  - apt-get update && apt-get install -y unzip git libicu-dev libxml2-dev libzip-dev gnupg curl
  # Installation des extensions PHP nécessaires
  - docker-php-ext-install pdo pdo_mysql intl zip
  # Installation de Composer
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  # Installation de Node.js et npm
  - apt-get install -y nodejs npm
  # Installation de Yarn : ajoutez le dépôt officiel et installez Yarn
  - curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
  - echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list
  - apt-get update && apt-get install -y yarn

install_dependencies:
  stage: install
  script:
    # Installation des dépendances PHP
    - composer install --prefer-dist --no-interaction --optimize-autoloader
    # Installation des dépendances Node.js
    - npm install
    - yarn install

php_lint:
  stage: lint
  script:
    # Exemple d'analyse statique du code PHP avec PHPStan
    - vendor/bin/phpstan analyse -l max -c phpstan.neon
  allow_failure: true
  only:
    - merge_requests
    - master

js_lint:
  stage: lint
  script:
    # Lancement d'ESLint via Yarn (adapté à votre configuration)
    - yarn lint
  allow_failure: true
  only:
    - merge_requests
    - master

test:
  stage: test
  script:
    # Met à jour le schéma de la base de test
    - php bin/console doctrine:schema:update --force --env=test
    # Exécute les tests PHPUnit
    - vendor/bin/phpunit

build_front:
  stage: build
  script:
    # Si vite.config.js contient une faute de frappe "jsxFrament", on la corrige avant la compilation.
    - sed -i 's/jsxFrament/jsxFragment/g' vite.config.js || true
    # Optionnel : vider le dossier de sortie si nécessaire
    - yarn build --emptyOutDir
  artifacts:
    paths:
      - public/build
