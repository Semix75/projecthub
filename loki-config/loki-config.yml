auth_enabled: false  # Désactive l'authentification

server:
  http_listen_port: 3100  # Définit le port HTTP sur lequel le serveur écoute

common:
  path_prefix: /loki  # Définit le chemin de base pour les fichiers et données
  replication_factor: 1  # Facteur de réplication (1 signifie pas de réplication)
  ring:
    instance_addr: 127.0.0.1  # Adresse de l'instance dans le ring
    kvstore:
      store: inmemory  # Utilise un stockage en mémoire pour le kvstore

schema_config:
  configs:
    - from: 2023-01-01  # Date de début de cette configuration
      store: tsdb  # Utilise TSDB (Time Series Database) comme backend de stockage
      object_store: filesystem  # Stockage des objets sur le système de fichiers
      schema: v13  # Version du schéma utilisée
      index:
        prefix: index_  # Préfixe pour les index
        period: 24h  # Période de rotation des index (toutes les 24 heures)

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index  # Répertoire pour les index actifs
    cache_location: /loki/index_cache  # Emplacement du cache des index
  filesystem:
    directory: /loki/chunks  # Répertoire pour stocker les chunks de données

limits_config:
  reject_old_samples: true  # Rejette les échantillons trop anciens
  reject_old_samples_max_age: 168h  # Âge maximal des échantillons acceptés (168 heures = 7 jours)
  allow_structured_metadata: false  # Désactive les métadonnées structurées pour éviter les erreurs liées à OTLP

compactor:
  working_directory: /loki/compactor  # Répertoire de travail pour le compactor (ajouté pour éviter une erreur de configuration)
